server:
  port: ${PORT:8080}

spring:
  application:
    name: core-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/erebixdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

# External ML Microservice Configuration (Modular, zero hardcoded URLs in code)
ml:
  service:
    url: ${ML_SERVICE_URL:http://127.0.0.1:8000}
    timeout-ms: ${ML_SERVICE_TIMEOUT:10000}

# CORS Configuration
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
